name: Validate Release ZIP

on:
  release:
    types: [published]

jobs:
  validate-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Download release ZIP
      uses: robinraju/release-downloader@v1
      with:
        repository: richardpizem-ctrl/SIRIUS-LOCAL-AI-BETA
        tag: ${{ github.event.release.tag_name }}
        fileName: "SIRIUS-LOCAL-AI-5.6.1.zip"
        outFilePath: "./release"

    - name: Install unzip
      run: sudo apt-get install -y unzip

    - name: Unzip release
      run: unzip ./release/SIRIUS-LOCAL-AI-5.6.1.zip -d ./unzipped

    - name: Validate required files
      run: |
        REQUIRED_FILES=(
          "runtime5/parser/InputParser5.py"
          "runtime5/runtime5_cli.py"
          "autosave_kg.json"
          "policies_envoy.json"
        )

        for FILE in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "./unzipped/$FILE" ]; then
            echo "❌ ERROR: Missing required file: $FILE"
            exit 1
          fi
        done

        echo "✅ ZIP validation passed. All required files are present."
